# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/
# Made with help from https://github.com/PREreview/prereview.org/blob/0864a9beb3ee6d2090b1a294dfff5c6c0fa97701/.github/workflows/ci.yml#L285-L350

name: Fly Build Image, Push, And Deploy
on:
  #[workflow_call]
  pull_request:  # For testing if something breaks
    branches:
      - main

jobs:
  build-and-push-image:
    name: Build Docker dev image and push to Fly.io registry
    runs-on: ubuntu-latest
    outputs:
      pushed-image: ${{ steps.image-name.outputs.image-to-push }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Generate image name
        id: image-name
        run: echo "image-to-push=registry.fly.io/movie-info-flyio:dev" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@v1.4
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Log in to the registry
        run: flyctl auth docker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Build Docker dev image
        id: build
        uses: docker/build-push-action@v7
        with:
          provenance: false
          platforms: linux/amd64,linux/arm64
          tags: registry.fly.io/movie-info-flyio:dev

  deploy-image:
    name: Deploy Docker dev image to fly.io
    runs-on: ubuntu-latest
    needs:
      - build-and-push-image
    strategy:
      fail-fast: false

    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@v1.4
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy app
        run: flyctl deploy --config fly.toml --image ${{ needs.build-and-push-image.outputs.pushed-image }} --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
