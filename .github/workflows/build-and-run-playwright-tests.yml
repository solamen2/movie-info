
# Made with help from https://playwright.dev/docs/ci#via-containers
name: 'CI - Run Playwright End-To-End Tests On Fly.Io Dev Instance'
on:
  push:
    branches:
      - main
  #pull_request:  # For testing if something breaks
    #branches:
      #- main

jobs:
  deploy-dev:
    uses: ./.github/workflows/fly-build-push-and-deploy.yml
    secrets: inherit
  test:
    needs: deploy-dev
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble  # NOTE: Update this when updating Playwright! Much faster than installing each time
      options: --user 1001

    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "25.x"

      - name: Install dependencies
        working-directory: ./movie-info-frontend
        run: npm ci

      - name: Run Playwright end-to-end tests with mock data
        run: npx playwright test --config ./playwright.config.ts --workers=1
        working-directory: ./movie-info-frontend
        env:
          CI: 1
          E2E_TEST_USE_MOCK_HTTP_CALLS: true
          PLAYWRIGHT_HTML_OUTPUT_DIR: ./mock-report/
          E2E_TEST_BASE_URL: https://movie-info-flyio.fly.dev/
          E2E_TEST_USERNAME: ${{ secrets.E2E_TEST_USERNAME }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-mock-report
          path: ./movie-info-frontend/mock-report/
          retention-days: 7

      - name: Run Playwright end-to-end tests with real data
        run: npx playwright test --config ./playwright.config.ts --workers=1
        working-directory: ./movie-info-frontend
        env:
          CI: 1
          E2E_TEST_USE_MOCK_HTTP_CALLS: false
          PLAYWRIGHT_HTML_OUTPUT_DIR: ./real-report/
          E2E_TEST_BASE_URL: https://movie-info-flyio.fly.dev/
          E2E_TEST_USERNAME: ${{ secrets.E2E_TEST_USERNAME }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-real-report
          path: ./movie-info-frontend/real-report/
          retention-days: 7

