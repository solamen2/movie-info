# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/
# Made with help from https://github.com/PREreview/prereview.org/blob/0864a9beb3ee6d2090b1a294dfff5c6c0fa97701/.github/workflows/ci.yml#L285-L350

name: Fly Build Image, Push, And Deploy
on:
  [workflow_call]
  #pull_request:  # For testing if something breaks
    #branches:
      #- main

jobs:
  build-image:
    name: Build Docker dev image
    runs-on: ubuntu-latest
    outputs:
      built-image: ${{ steps.build.outputs.imageid }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker dev image
        id: build
        uses: docker/build-push-action@v7
        with:
          provenance: false
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=/tmp/mi-image.tar
          cache-from: type=gha,ignore-error=true
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: movie-info-image
          path: /tmp/mi-image.tar
  
  push-image:
    name: Push Docker dev image to fly.io Docker registry
    runs-on: ubuntu-latest
    outputs:
      pushed-image: ${{ steps.image-name.outputs.image-to-push }}
    needs: build-image
    steps:
      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@v1.4

      - name: Log in to the registry
        run: flyctl auth docker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Download image
        uses: actions/download-artifact@v8
        with:
          name: movie-info-image
          path: /tmp

      - name: Set up Docker
        uses: docker/setup-docker-action@v4
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Load image
        run: docker load --input /tmp/mi-image.tar

      - name: Generate image name
        id: image-name
        run: echo "image-to-push=registry.fly.io/movie-info-flyio:dev" >> $GITHUB_OUTPUT

      - name: Tag image
        run: docker tag ${{ needs.build-image.outputs.built-image }} ${{ steps.image-name.outputs.image-to-push }}

      - name: Push image
        run: docker push ${{ steps.image-name.outputs.image-to-push }}

  deploy-image:
    name: Deploy Docker dev image to fly.io
    runs-on: ubuntu-latest
    needs:
      - push-image
    strategy:
      fail-fast: false

    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@v1.4

      - name: Deploy app
        run: flyctl deploy --config fly.toml --image ${{ needs.push-image.outputs.pushed-image }} --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
