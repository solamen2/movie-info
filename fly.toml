# fly.toml app configuration file generated for movie-info-flyio on 2025-11-19T12:58:59-08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'movie-info-flyio'
primary_region = 'sjc'

[build]
  dockerfile = "Dockerfile"
  build-target = "deploy"

[env]
  ASPNETCORE_ENVIRONMENT = "Development"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
