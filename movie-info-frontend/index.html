<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/movie-info.png" />
    <link rel="apple-touch-icon" href="/movie-info.png" />
    <!-- Makes every page part of the Home Screen app. Without it, iOS treats
         only the page the app was added from as the app and shows a domain
         bar on all the others. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-title" content="Movie Info" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Search</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
